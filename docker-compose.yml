# Platform profile: Postgres and Redis for the hosted deployment.
# Lite mode (self host) needs none of this and uses SQLite.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
