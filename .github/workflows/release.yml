name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Trusted publishing (OIDC) needs Node 22.14 or later and npm 11.5.1 or
      # later. There is no npm token: npm trades the job's id-token for a
      # short lived publish token, and adds provenance on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      # The tag decides the version and the npm dist tag. v3.1.0 publishes to
      # latest, v3.1.0-beta.0 to beta, so a prerelease never replaces the
      # version people get from a plain `npm install`.
      - name: Resolve version and dist tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then tag=latest; else tag="${prerelease%%.*}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under the $tag dist tag"
      - name: Check package versions match the tag
        run: |
          mismatched=$(pnpm -r ls --depth -1 --json | node -e '
            const want = process.argv[1]
            const pkgs = JSON.parse(require("fs").readFileSync(0, "utf8"))
            for (const p of pkgs) if (!p.private && p.version !== want) console.log(`${p.name}@${p.version}`)
          ' "${{ steps.version.outputs.version }}")
          if [ -n "$mismatched" ]; then
            echo "These packages are not at ${{ steps.version.outputs.version }}:"
            echo "$mismatched"
            exit 1
          fi
      - run: pnpm build
      - run: pnpm test
      # Pack with pnpm, which turns workspace: ranges into real versions, then
      # publish the tarballs with npm, which does the OIDC exchange. A version
      # that is already on npm (a first publish done by hand) is skipped, so
      # re-running a tag only publishes what is missing.
      - run: pnpm smoke:pack --out .packs
      - name: Publish
        run: |
          for tarball in .packs/*.tgz; do
            name=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            if npm view "$name@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
              echo "$name@${{ steps.version.outputs.version }} is already on npm, skipping"
              continue
            fi
            npm publish "$tarball" --access public --tag "${{ steps.version.outputs.tag }}"
          done

  # The GitHub release carries this version's changelog section, and is marked
  # as a prerelease for a beta or rc tag. It runs after publishing, in its own
  # job, so only this step gets write access to the repo.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > release-notes.md
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a release"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $flags
          fi
